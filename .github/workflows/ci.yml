name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: node --test --test-concurrency=1 "test/*.test.ts"

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the reference Rust implementation
        run: cargo install bore-cli --version 0.6.0 --locked

      - run: npm ci
      - run: npm run build

      - name: Cross-implementation interop tests
        env:
          BORE_RUST_BIN: /home/runner/.cargo/bin/bore
        run: node --test --test-concurrency=1 test/interop.test.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bore-js .
      - run: docker run --rm bore-js --version
